syntax = "proto3";

package ultra.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aleksclark/ultralogical/gen/go/ultra/v1;ultrav1";

// Session is the durable unit of work. It outlives any process, UI, agent
// loop, or environment, and owns an append-only event log.
message Session {
  string id = 1;
  string org_id = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp archived_at = 5;
}

message CreateSessionRequest {
  string org_id = 1;
  string title = 2;
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  string org_id = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message Participant { string session_id=1; string kind=2; string participant_id=3; string display=4; string state=5; google.protobuf.Timestamp joined_at=6; google.protobuf.Timestamp last_seen_at=7; }
message JoinRequest { string session_id=1; string display=2; }
message JoinResponse { repeated Participant participants=1; int64 event_seq=2; }
message LeaveRequest { string session_id=1; }
message LeaveResponse { int64 event_seq=1; }
message HeartbeatRequest { string session_id=1; }
message HeartbeatResponse {}
message ListParticipantsRequest { string session_id=1; }
message ListParticipantsResponse { repeated Participant participants=1; }
message MemoryEntry { string key=1; string value_json=2; string updated_by_type=3; string updated_by_id=4; google.protobuf.Timestamp updated_at=5; }
message SetMemoryRequest { string session_id=1; string key=2; string value_json=3; }
message SetMemoryResponse { int64 event_seq=1; }
message GetMemoryRequest { string session_id=1; string key=2; }
message GetMemoryResponse { MemoryEntry entry=1; }
message ListMemoryRequest { string session_id=1; }
message ListMemoryResponse { repeated MemoryEntry entries=1; }
message DeleteMemoryRequest { string session_id=1; string key=2; }
message DeleteMemoryResponse { int64 event_seq=1; }

// SessionService manages session lifecycle. Access requires membership in
// the session's org; missing sessions and cross-tenant access return the
// same not-found error so existence never leaks.
service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ListParticipants(ListParticipantsRequest) returns (ListParticipantsResponse);
  rpc SetMemory(SetMemoryRequest) returns (SetMemoryResponse);
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);
  rpc ListMemory(ListMemoryRequest) returns (ListMemoryResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
}
