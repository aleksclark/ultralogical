syntax = "proto3";

package ultra.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aleksclark/ultralogical/gen/go/ultra/v1;ultrav1";

// ActorType classifies who produced an event.
enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  ACTOR_TYPE_USER = 1;
  ACTOR_TYPE_AGENT = 2;
  ACTOR_TYPE_SYSTEM = 3;
}

// Actor identifies the producer of an event.
message Actor {
  ActorType type = 1;
  string id = 2;
}

// UserMessage is a human message into the session.
message UserMessage {
  string text = 1;
}

// Annotation is a free-form note attached to the session log.
message Annotation {
  string text = 1;
}

// EventPayload is the typed payload of a session event. Every observable
// thing in a session is one of these variants; later phases add variants
// (additive only — enforced by breaking-change CI).
message EventPayload {
  oneof payload {
    UserMessage user_message = 10;
    Annotation annotation = 11;
  }
}

// SessionEvent is one entry in a session's append-only event log. Seq is
// per-session, gapless, and monotonic; clients resume by seq.
message SessionEvent {
  string session_id = 1;
  int64 seq = 2;
  google.protobuf.Timestamp ts = 3;
  Actor actor = 4;
  EventPayload payload = 5;
}

message AppendRequest {
  string session_id = 1;
  EventPayload payload = 2;
}

message AppendResponse {
  // Seq of the event this mutation produced; clients can await consistency
  // by subscribing past it.
  int64 seq = 1;
}

message SubscribeRequest {
  string session_id = 1;
  // Deliver events with seq greater than from_seq. Zero replays the full log.
  int64 from_seq = 2;
}

message SubscribeResponse {
  // Unset event is a keepalive: sent immediately on stream establishment
  // (and periodically later) so clients can distinguish "connected, no
  // events yet" from a stalled connection. Clients must skip it.
  SessionEvent event = 1;
}

// EventService is the observation surface: streaming, multiplayer, history
// replay, and test assertions all use Subscribe.
service EventService {
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}
