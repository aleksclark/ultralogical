syntax = "proto3";
package ultra.v1;

import "google/protobuf/timestamp.proto";
option go_package = "github.com/aleksclark/ultralogical/gen/go/ultra/v1;ultrav1";

enum EnvState {
  ENV_STATE_UNSPECIFIED = 0;
  ENV_STATE_REQUESTED = 1;
  ENV_STATE_PROVISIONING = 2;
  ENV_STATE_READY = 3;
  ENV_STATE_SUSPENDED = 4;
  ENV_STATE_TERMINATING = 5;
  ENV_STATE_TERMINATED = 6;
  ENV_STATE_FAILED = 7;
}

message EnvSpec {
  string name = 1;
  string image = 2;
  string workdir = 3;
  map<string,string> env = 4;
  map<string,string> metadata = 5;
}

message DevEnv {
  string id = 1;
  string session_id = 2;
  string provider_instance_id = 3;
  EnvState state = 4;
  EnvSpec spec = 5;
  string endpoint = 6;
  int32 epoch = 7;
  string failure_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp ready_at = 11;
  google.protobuf.Timestamp terminated_at = 12;
  // Flow provenance: which invocation created this environment and which flow
  // environment declaration it satisfies. Both are immutable once written.
  string flow_invocation_id = 13;
  string flow_env_name = 14;
  // Which registration actually hosts this environment. The id alone is not
  // usable by a person: an operator diagnosing a fault needs to know it is
  // "the staging cluster" rather than a UUID, and which kind it is.
  string provider_name = 15;
  string provider_kind = 16;
  // The hosting provider's health at the time of the read, so a client can
  // explain an environment that is failing because its provider is.
  string provider_state = 17;
}

message ProvisionEnvRequest { string session_id = 1; EnvSpec spec = 2; string provider_instance = 3; }
message ProvisionEnvResponse { DevEnv env = 1; int64 event_seq = 2; }
message GetEnvRequest { string env_id = 1; }
message GetEnvResponse { DevEnv env = 1; }
message ListEnvsRequest { string session_id = 1; }
message ListEnvsResponse { repeated DevEnv envs = 1; }
message TerminateEnvRequest { string env_id = 1; }
message TerminateEnvResponse {}
message ExecPreviewRequest { string env_id = 1; string command = 2; }
message ExecPreviewResponse { string output = 1; bool is_error = 2; int64 event_seq = 3; }
// RestartEnv replaces the environment's runtime while preserving its
// workspace, mints a new bearer token, and increments epoch. The prior token
// stops working and cached tool clients bound to the old epoch are invalid.
message RestartEnvRequest { string env_id = 1; }
message RestartEnvResponse { DevEnv env = 1; int64 event_seq = 2; }

service EnvService {
  rpc ProvisionEnv(ProvisionEnvRequest) returns (ProvisionEnvResponse);
  rpc GetEnv(GetEnvRequest) returns (GetEnvResponse);
  rpc ListEnvs(ListEnvsRequest) returns (ListEnvsResponse);
  rpc TerminateEnv(TerminateEnvRequest) returns (TerminateEnvResponse);
  rpc ExecPreview(ExecPreviewRequest) returns (ExecPreviewResponse);
  rpc RestartEnv(RestartEnvRequest) returns (RestartEnvResponse);
}

message GetUsageRequest { string org_id = 1; google.protobuf.Timestamp from = 2; google.protobuf.Timestamp to = 3; }
// UsageInterval is one metering interval. last_metered_at is the crash-safe
// watermark: a control-plane death can under-count by at most one heartbeat
// and can never over-count.
message UsageInterval {
  string env_id = 1;
  string provider_instance_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp ended_at = 4;
  int64 seconds = 5;
  string rate_class = 6;
  google.protobuf.Timestamp last_metered_at = 7;
  bool open = 8;
}
message GetUsageResponse { repeated UsageInterval intervals = 1; int64 total_seconds = 2; }
service BillingService { rpc GetUsage(GetUsageRequest) returns (GetUsageResponse); }
