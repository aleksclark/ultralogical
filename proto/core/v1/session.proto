syntax = "proto3";

package core.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aleksclark/ultracore/gen/go/core/v1;corev1";

// Session is the durable unit of work. It outlives any process, UI, agent
// loop, or resource, and owns an append-only event log.
message Session {
  string id = 1;
  string tenant_id = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp archived_at = 5;
  map<string, string> labels = 6;
}

message CreateSessionRequest {
  string tenant_id = 1;
  string title = 2;
  map<string, string> labels = 3;
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

// LabelSelector is one equality or set-membership predicate.
// op is "=" or "in". values has length 1 for equality.
message LabelSelector {
  string key = 1;
  string op = 2;
  repeated string values = 3;
}

message ListSessionsRequest {
  string tenant_id = 1;
  repeated LabelSelector label_selectors = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message UpdateSessionLabelsRequest {
  string session_id = 1;
  map<string, string> labels = 2;
}

message UpdateSessionLabelsResponse {
  Session session = 1;
  int64 event_seq = 2;
}

message MemoryEntry {
  string key = 1;
  string value_json = 2;
  string updated_by_type = 3;
  string updated_by_id = 4;
  google.protobuf.Timestamp updated_at = 5;
}
message SetMemoryRequest { string session_id = 1; string key = 2; string value_json = 3; }
message SetMemoryResponse { int64 event_seq = 1; }
message GetMemoryRequest { string session_id = 1; string key = 2; }
message GetMemoryResponse { MemoryEntry entry = 1; }
message ListMemoryRequest { string session_id = 1; }
message ListMemoryResponse { repeated MemoryEntry entries = 1; }
message DeleteMemoryRequest { string session_id = 1; string key = 2; }
message DeleteMemoryResponse { int64 event_seq = 1; }

// SessionService manages session lifecycle, labels, and session memory.
// Access requires a key belonging to the session's tenant; missing sessions
// and cross-tenant access return the same not-found error so existence never
// leaks.
service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc UpdateSessionLabels(UpdateSessionLabelsRequest) returns (UpdateSessionLabelsResponse);
  rpc SetMemory(SetMemoryRequest) returns (SetMemoryResponse);
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);
  rpc ListMemory(ListMemoryRequest) returns (ListMemoryResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
}
