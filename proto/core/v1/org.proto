syntax = "proto3";

package core.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aleksclark/ultracore/gen/go/core/v1;corev1";

// Tenant is the tenancy boundary.
message Tenant {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 4;
}

// KeyScope is the authority granted by one API key.
enum KeyScope {
  KEY_SCOPE_UNSPECIFIED = 0;
  KEY_SCOPE_ADMIN = 1;
  KEY_SCOPE_SESSIONS = 2;
}

// APIKeyInfo is the listable, secret-free view of a tenant API key.
message APIKeyInfo {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  KeyScope scope = 4;
  string prefix = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
}

message CreateTenantRequest {
  string name = 1;
}

message CreateTenantResponse {
  Tenant tenant = 1;
  // Raw key returned once at creation. Never stored or logged.
  string admin_key = 2;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message ListTenantsRequest {}

message ListTenantsResponse {
  // Tenants the caller's key can see (its own tenant).
  repeated Tenant tenants = 1;
}

message CreateAPIKeyRequest {
  string tenant_id = 1;
  string name = 2;
  KeyScope scope = 3;
}

message CreateAPIKeyResponse {
  APIKeyInfo key = 1;
  // Raw key returned once. Never stored or logged.
  string raw_key = 2;
}

message ListAPIKeysRequest {
  string tenant_id = 1;
}

message ListAPIKeysResponse {
  repeated APIKeyInfo keys = 1;
}

message RevokeAPIKeyRequest {
  string tenant_id = 1;
  string key_id = 2;
}

message RevokeAPIKeyResponse {}

// CredentialInfo is the listable, secret-free view of a credential.
// Payload values are write-only: they never appear in any response.
message CredentialInfo {
  string kind = 1; // e.g. inference:openai
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp rotated_at = 4;
}

message PutCredentialRequest {
  string tenant_id = 1;
  string kind = 2; // inference:openai | inference:anthropic | inference:bedrock
  string name = 3; // "default" if empty
  // Write-only secret material.
  string api_key = 4;
  string base_url = 5; // optional vendor endpoint override
  // JSON object of string header values, e.g.
  // {"cf-aig-collect-log-payload":"false","cf-aig-metadata":"{...}"}
  string extra_headers_json = 6;
}

message PutCredentialResponse {
  CredentialInfo credential = 1;
}

message ListCredentialsRequest {
  string tenant_id = 1;
}

message ListCredentialsResponse {
  repeated CredentialInfo credentials = 1;
}

message DeleteCredentialRequest {
  string tenant_id = 1;
  string kind = 2;
  string name = 3;
}

message DeleteCredentialResponse {}

// ProviderCapability names one optional behavior a registration's control
// plane reported it can perform, or explains why it cannot. Capabilities are
// discovered by probing at registration rather than inferred from the kind,
// because two clusters registered under one kind can differ.
message ProviderCapability {
  string name = 1;
  bool supported = 2;
  // reason explains an unsupported capability, so an operator can act on it
  // rather than only observe its absence.
  string reason = 3;
}

message ProviderInstance {
  string id = 1;
  string tenant_id = 2;
  string kind = 3;
  string name = 4;
  string state = 6;
  google.protobuf.Timestamp last_healthy_at = 7;
  google.protobuf.Timestamp created_at = 8;
  repeated ProviderCapability capabilities = 9;
}
message RegisterProviderRequest { string tenant_id = 1; string kind = 2; string name = 3; string config_json = 4; }
message RegisterProviderResponse { ProviderInstance provider = 1; }
message ListProvidersRequest { string tenant_id = 1; }
message ListProvidersResponse { repeated ProviderInstance providers = 1; }
message DeleteProviderRequest { string tenant_id = 1; string provider_id = 2; }
message DeleteProviderResponse {}

// TenantService manages tenants, API keys, credentials, and provider
// instances. CreateTenant is bootstrap-only (no prior key required once a
// deployment-level bootstrap path exists; for now any authenticated admin
// key may create additional tenants). Credential payloads are write-only and
// encrypted at rest. Raw API keys are returned once at creation.
service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
  rpc RegisterProvider(RegisterProviderRequest) returns (RegisterProviderResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
}
