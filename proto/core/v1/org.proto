syntax = "proto3";

package core.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aleksclark/ultracore/gen/go/core/v1;corev1";

// OrgRole is a user's role within an org.
enum OrgRole {
  ORG_ROLE_UNSPECIFIED = 0;
  ORG_ROLE_OWNER = 1;
  ORG_ROLE_ADMIN = 2;
  ORG_ROLE_MEMBER = 3;
}

// Org is the tenancy boundary.
message Org {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 4;
}

// OrgMember links a user to an org with a role.
message OrgMember {
  string org_id = 1;
  string user_id = 2;
  string email = 3;
  OrgRole role = 4;
  google.protobuf.Timestamp joined_at = 5;
}

message CreateOrgRequest {
  string name = 1;
}

message CreateOrgResponse {
  Org org = 1;
}

message GetOrgRequest {
  string org_id = 1;
}

message GetOrgResponse {
  Org org = 1;
}

message InviteMemberRequest {
  string org_id = 1;
  // Email of an existing user. Invitation flows for unknown emails are a
  // later phase; for now the user must already exist.
  string email = 2;
  OrgRole role = 3;
}

message InviteMemberResponse {
  OrgMember member = 1;
}

message ListMembersRequest {
  string org_id = 1;
}

message ListMembersResponse {
  repeated OrgMember members = 1;
}

message ListOrgsRequest {}

message ListOrgsResponse {
  // Orgs the caller is a member of.
  repeated Org orgs = 1;
}

// CredentialInfo is the listable, secret-free view of a credential.
// Payload values are write-only: they never appear in any response.
message CredentialInfo {
  string kind = 1; // e.g. inference:openai
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp rotated_at = 4;
}

message PutCredentialRequest {
  string org_id = 1;
  string kind = 2; // inference:openai | inference:anthropic | inference:bedrock
  string name = 3; // "default" if empty
  // Write-only secret material.
  string api_key = 4;
  string base_url = 5; // optional vendor endpoint override
  // JSON object of string header values, e.g.
  // {"cf-aig-collect-log-payload":"false","cf-aig-metadata":"{...}"}
  string extra_headers_json = 6;
}

message PutCredentialResponse {
  CredentialInfo credential = 1;
}

message ListCredentialsRequest {
  string org_id = 1;
}

message ListCredentialsResponse {
  repeated CredentialInfo credentials = 1;
}

message DeleteCredentialRequest {
  string org_id = 1;
  string kind = 2;
  string name = 3;
}

message DeleteCredentialResponse {}

// ProviderCapability names one optional behavior a registration's control
// plane reported it can perform, or explains why it cannot. Capabilities are
// discovered by probing at registration rather than inferred from the kind,
// because two clusters registered under one kind can differ.
message ProviderCapability {
  string name = 1;
  bool supported = 2;
  // reason explains an unsupported capability, so an operator can act on it
  // rather than only observe its absence.
  string reason = 3;
}

message ProviderInstance {
  string id = 1;
  string org_id = 2;
  string kind = 3;
  string name = 4;
  string state = 6;
  google.protobuf.Timestamp last_healthy_at = 7;
  google.protobuf.Timestamp created_at = 8;
  repeated ProviderCapability capabilities = 9;
}
message RegisterProviderRequest { string org_id = 1; string kind = 2; string name = 3; string config_json = 4; }
message RegisterProviderResponse { ProviderInstance provider = 1; }
message ListProvidersRequest { string org_id = 1; }
message ListProvidersResponse { repeated ProviderInstance providers = 1; }
message DeleteProviderRequest { string org_id = 1; string provider_id = 2; }
message DeleteProviderResponse {}

// OrgService manages orgs, membership, credentials, and provider instances. The caller of
// CreateOrg becomes the org's owner. Credential payloads are write-only and
// encrypted at rest.
service OrgService {
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse);
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
  rpc RegisterProvider(RegisterProviderRequest) returns (RegisterProviderResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
}
