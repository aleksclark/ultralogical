syntax = "proto3";

package core.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aleksclark/ultracore/gen/go/core/v1;corev1";

// ProviderCapability names one optional behavior a registration's control
// plane reported it can perform, or explains why it cannot.
message ProviderCapability {
  string name = 1;
  bool supported = 2;
  string reason = 3;
}

message ProviderInstance {
  string id = 1;
  string tenant_id = 2;
  string kind = 3;
  string name = 4;
  string state = 5;
  google.protobuf.Timestamp last_healthy_at = 6;
  google.protobuf.Timestamp created_at = 7;
  repeated ProviderCapability capabilities = 8;
}

message RegisterProviderRequest {
  string tenant_id = 1;
  string kind = 2;
  string name = 3;
  string config_json = 4;
}
message RegisterProviderResponse {
  ProviderInstance provider = 1;
}

message ListProvidersRequest {
  string tenant_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListProvidersResponse {
  repeated ProviderInstance providers = 1;
  string next_page_token = 2;
}

message GetProviderRequest {
  string tenant_id = 1;
  string provider_id = 2;
}
message GetProviderResponse {
  ProviderInstance provider = 1;
}

message DeregisterProviderRequest {
  string tenant_id = 1;
  string provider_id = 2;
}
message DeregisterProviderResponse {}

// ProviderService manages tenant-scoped provider registrations. Registration
// probes the real control plane; a stored registration is one that answered.
service ProviderService {
  rpc RegisterProvider(RegisterProviderRequest) returns (RegisterProviderResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc GetProvider(GetProviderRequest) returns (GetProviderResponse);
  rpc DeregisterProvider(DeregisterProviderRequest) returns (DeregisterProviderResponse);
}
