name: ci

on:
  push:
    # This repository's default branch is master; naming only main here meant
    # no checks ever ran on a merge.
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf breaking (drift gate A0.5)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          buf breaking --against ".git#branch=origin/${{ github.base_ref }},subdir=."
      - name: codegen diff (drift gate A0.5)
        run: bash scripts/verify-codegen.sh
      - name: rust codegen coverage (drift gate A7.1)
        run: python3 scripts/verify-codegen-rust.py
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # A7.1: prove the codegen drift gates fail for the intended reason.
      - name: codegen drift mutation gate (A7.1)
        run: bash scripts/mutate-codegen-gate.sh
      # A7.9: prove coverage verification rejects false evidence claims.
      - name: evidence integrity mutation gate (A7.9)
        run: bash scripts/mutate-coverage-gate.sh
      - name: coverage matrix
        run: python3 scripts/verify-coverage.py
      - name: no stray tree changes after the mutation gates
        run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit, store, provider, and jobqueue conformance tests
        run: go test $(go list ./... | grep -v '/e2e$') -count=1 -timeout 30m
      # A9.9: the shipped flow examples and the commands docs/flows.md
      # documents must actually validate, not merely be checked in.
      - name: Documented flow examples validate
        run: go run ./cmd/ultra help && go test . -run TestValidateFlowDefinition -count=1

  dev-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the pinned Bezalel image
        run: docker build -t ultralogical/bezalel:phase2-test https://github.com/aleksclark/bezalel.git#2504ff3152d0ee4e999210641d50ebf5483aa120
      # A7.8: the documented one-command stack boots, works, and leaks nothing.
      - name: One-command dev stack smoke
        run: bash scripts/dev-stack.sh smoke
      - name: Assert no leaked containers
        run: |
          leaked=$(docker ps -aq --filter "label=ultralogical.env_id")
          if [ -n "$leaked" ]; then
            echo "leaked environment containers: $leaked" >&2
            exit 1
          fi

  # A10.8: provider adapters are exercised against the control planes they
  # claim to drive. A leg that could not stand its cluster up must fail, not
  # skip: a skipped provider test is indistinguishable from a passing one.
  providers-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the pinned Bezalel image
        run: docker build -t ultralogical/bezalel:phase2-test https://github.com/aleksclark/bezalel.git#2504ff3152d0ee4e999210641d50ebf5483aa120
      - name: Create a kind cluster
        run: |
          cat > /tmp/kind.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30080
                  hostPort: 30080
                  listenAddress: "127.0.0.1"
                - containerPort: 30081
                  hostPort: 30081
                  listenAddress: "127.0.0.1"
                - containerPort: 30082
                  hostPort: 30082
                  listenAddress: "127.0.0.1"
          YAML
          go run sigs.k8s.io/kind@v0.32.0 create cluster --name ultra-test --config /tmp/kind.yaml --wait 180s
          go run sigs.k8s.io/kind@v0.32.0 load docker-image ultralogical/bezalel:phase2-test --name ultra-test
      - name: The onboarding guide is executable
        env:
          ULTRA_BEZALEL_IMAGE: ultralogical/bezalel:phase2-test
        run: |
          set -o pipefail
          go run sigs.k8s.io/kind@v0.32.0 get kubeconfig --name ultra-test > /tmp/kubeconfig
          out=$(ULTRA_TEST_KUBECONFIG=/tmp/kubeconfig             go test ./cmd/ultra/... -count=1 -v -timeout 20m -run TestA109 2>&1)
          echo "$out"
          # A guide whose commands were never executed is a guide nobody has
          # checked, so a skip must fail the leg.
          echo "$out" | grep -q -- "--- PASS: TestA109_KubernetesOnboardingGuideIsExecutable" || {
            echo "the onboarding guide was not executed against a real cluster" >&2
            exit 1
          }
      - name: Kubernetes conformance and hosted isolation
        env:
          ULTRA_BEZALEL_IMAGE: ultralogical/bezalel:phase2-test
        run: go test ./envprovider/k8s/... -count=1 -v -timeout 30m
      - name: Prove the cluster leg actually ran
        env:
          ULTRA_BEZALEL_IMAGE: ultralogical/bezalel:phase2-test
        run: |
          # A skipped provider test looks exactly like a passing one, so the
          # leg fails when its cluster evidence did not execute.
          out=$(go test ./envprovider/k8s/... -count=1 -v -timeout 30m \
            -run 'TestKubernetesConformance|TestA102_|TestA103_' 2>&1)
          echo "$out"
          echo "$out" | grep -q -- "--- PASS: TestKubernetesConformance/ProviderNativeResources" || {
            echo "the Kubernetes leg did not inspect provider-native resources" >&2
            exit 1
          }
          # A10.2: convergence after an out-of-band deletion is the evidence
          # that an environment does not sit stale, so a skip must fail the leg.
          for name in TestA102_KubernetesReconcilesExternallyDeletedPod \
                      TestA102_KubernetesAdoptsInterruptedProvisioning \
                      TestA103_HostedIsolationAndQuota; do
            echo "$out" | grep -q -- "--- PASS: $name" || {
              echo "the Kubernetes leg did not run $name" >&2
              exit 1
            }
          done
      - name: Dump cluster state on failure
        if: failure()
        run: go run sigs.k8s.io/kind@v0.32.0 export logs /tmp/kind-logs --name ultra-test || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kind-logs
          path: /tmp/kind-logs

  providers-nomad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the pinned Bezalel image
        run: docker build -t ultralogical/bezalel:phase2-test https://github.com/aleksclark/bezalel.git#2504ff3152d0ee4e999210641d50ebf5483aa120
      - name: Install Nomad
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y nomad
      - name: Start a Nomad dev agent
        run: |
          sudo nomad agent -dev -bind 127.0.0.1 > /tmp/nomad.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4646/v1/agent/health >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "the Nomad dev agent never became healthy" >&2
          cat /tmp/nomad.log >&2
          exit 1
      - name: Nomad conformance
        env:
          ULTRA_BEZALEL_IMAGE: ultralogical/bezalel:phase2-test
        run: |
          out=$(go test ./envprovider/nomad/... -count=1 -v -timeout 30m 2>&1)
          echo "$out"
          echo "$out" | grep -q -- "--- PASS: TestNomadConformance/ProviderNativeResources" || {
            echo "the Nomad leg did not inspect provider-native resources" >&2
            exit 1
          }
          # A10.4: same reasoning as the Kubernetes leg. A stopped allocation
          # has to converge, and a skipped test would hide that it does not.
          for name in TestA104_NomadReconcilesExternallyStoppedAllocation \
                      TestA104_NomadReusesInterruptedRegistration; do
            echo "$out" | grep -q -- "--- PASS: $name" || {
              echo "the Nomad leg did not run $name" >&2
              exit 1
            }
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nomad-log
          path: /tmp/nomad.log

  providers-tunnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the pinned Bezalel image
        run: docker build -t ultralogical/bezalel:phase2-test https://github.com/aleksclark/bezalel.git#2504ff3152d0ee4e999210641d50ebf5483aa120
      - name: Tunnel conformance, signing, and suspend/resume
        env:
          ULTRA_BEZALEL_IMAGE: ultralogical/bezalel:phase2-test
        run: |
          out=$(go test ./envprovider/tunnel/... -count=1 -v -timeout 30m 2>&1)
          echo "$out"
          echo "$out" | grep -q -- "--- PASS: TestTunnelConformance/ProviderNativeResources" || {
            echo "the tunnel leg did not inspect provider-native resources" >&2
            exit 1
          }
          # A10.5: a lost host must suspend rather than fail, which is the
          # difference between a paused laptop and a destroyed workspace.
          echo "$out" | grep -q -- "--- PASS: TestA105_LostTransportSuspendsRatherThanFails" || {
            echo "the tunnel leg did not prove a lost host suspends rather than fails" >&2
            exit 1
          }
          # A10.5/A10.8: the contract must pass over a real outbound tunnel,
          # and the agent must accept no inbound connections. A transport the
          # platform could dial directly would not be a tunnel at all.
          for name in TestTunnelConformanceOverRealTransport                       TestA105_TheAgentAcceptsNoInboundConnections                       TestA105_RealTunnelSeveredAndRestored; do
            echo "$out" | grep -q -- "--- PASS: $name" || {
              echo "the tunnel leg did not run $name" >&2
              exit 1
            }
          done

  providers-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the pinned Bezalel image
        run: docker build -t ultralogical/bezalel:phase2-test https://github.com/aleksclark/bezalel.git#2504ff3152d0ee4e999210641d50ebf5483aa120
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      # The walkthrough provider gives each environment its own /work by
      # entering a mount namespace, so the runner has to permit that. This is
      # a property of the runner image, not of the provider.
      - name: Permit unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --map-root-user --mount true || {
            echo "this runner cannot create unprivileged user namespaces" >&2
            exit 1
          }
      - name: Static walkthrough provider conformance
        env:
          ULTRA_BEZALEL_IMAGE: ultralogical/bezalel:phase2-test
        run: |
          # set -o pipefail keeps a failing test from looking green when the
          # grep guard is what the shell would otherwise exit on. tee streams
          # the suite live so a hang cannot hide its own output the way the
          # previous out=$(...) form did on the first attempt.
          set -o pipefail
          go test ./envprovider/static/... -count=1 -v -timeout 30m 2>&1 | tee /tmp/static-provider.log
          out=$(cat /tmp/static-provider.log)
          for step in ProviderNativeResources RestartRotatesToken LeakCheck; do
            echo "$out" | grep -q -- "--- PASS: TestA109_StaticProviderWalkthrough/$step" || {
              echo "the static walkthrough leg did not run $step" >&2
              exit 1
            }
          done
          echo "$out" | grep -q -- "--- PASS: TestA109_StaticProviderStaysUnderTheDocumentedSize" || {
            echo "the documented size check did not run" >&2
            exit 1
          }
          # A10.9: the kind must be reachable through the production registry
          # the worker builds, not only through a test-local factory.
          echo "$out" | grep -q -- "--- PASS: TestA109_WorkerSelectsStaticConfiguration/ProviderNativeResources" || {
            echo "the static walkthrough leg did not prove worker selection" >&2
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: static-provider-log
          path: /tmp/static-provider.log

  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - name: Install TS client deps
        working-directory: clients/ts
        run: npm ci
      - name: Typecheck TS client
        working-directory: clients/ts
        run: npx tsc --noEmit
      - name: Install web UI deps
        working-directory: ui/web
        run: npm ci
      - name: Build web UI
        working-directory: ui/web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: ui/web
        run: npx playwright install --with-deps chromium
      # The browser and desktop provider evidence registers a real cluster, so
      # the functional leg needs one.
      - name: Create a kind cluster
        run: |
          cat > /tmp/kind.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30080
                  hostPort: 30080
                  listenAddress: "127.0.0.1"
                - containerPort: 30081
                  hostPort: 30081
                  listenAddress: "127.0.0.1"
                - containerPort: 30082
                  hostPort: 30082
                  listenAddress: "127.0.0.1"
          YAML
          go run sigs.k8s.io/kind@v0.32.0 create cluster --name ultra-test --config /tmp/kind.yaml --wait 180s
          docker build -t ultralogical/bezalel:phase2-test https://github.com/aleksclark/bezalel.git#2504ff3152d0ee4e999210641d50ebf5483aa120
          go run sigs.k8s.io/kind@v0.32.0 load docker-image ultralogical/bezalel:phase2-test --name ultra-test
          go run sigs.k8s.io/kind@v0.32.0 get kubeconfig --name ultra-test > /tmp/kubeconfig
          echo "ULTRA_TEST_KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # GPUI links against xkbcommon's X11 companion library, which
      # libxkbcommon-dev alone does not provide.
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libx11-dev \
            libasound2-dev libfontconfig-dev libvulkan1 \
            cmake clang lld llvm
      - name: Build Rust client and desktop application
        run: cargo test --manifest-path ui/desktop/Cargo.toml --no-run
      - name: Verify rust codegen output covers every proto
        run: python3 scripts/verify-codegen-rust.py --require-generated
      - name: Validate cross-client coverage matrix
        run: python3 scripts/verify-coverage.py
      - name: Functional API + web + GPUI desktop suite (real stack)
        run: go test ./e2e/ -count=1 -v -timeout 45m
