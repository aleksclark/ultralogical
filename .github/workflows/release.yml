name: release

# Publish an immutable GHCR image for ultracore after master merges.
# Tag strategy: CalVer vYYYY.M.N (semver-compatible), matching fleet Go services.
# Deploy authority is the image digest, never :latest.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "agent_docs/**"
      - "docs/**"
      - "plan/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-ultracore
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Determine CalVer version
        id: version
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          PREFIX="v${YEAR}.${MONTH}"
          LATEST=$(git tag --list "${PREFIX}.*" --sort=-v:refname | head -1 || true)
          if [ -z "${LATEST}" ]; then
            PATCH=0
          else
            PATCH=$(echo "${LATEST}" | sed "s/${PREFIX}\\.//")
            PATCH=$((PATCH + 1))
          fi
          VERSION="${PREFIX}.${PATCH}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION}"

      - name: Unit smoke (config + health + deploy contract)
        run: |
          set -euo pipefail
          go test ./config ./http ./adminhttp ./deploy/nomad/tests -count=1 -timeout 5m

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.6.0 / v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3.x/v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5/v6.2.0
        with:
          images: |
            ghcr.io/aleksclark/ultracore
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=ultracore
            org.opencontainers.image.description=Durable-session substrate (ultralogical)
            org.opencontainers.image.source=https://github.com/aleksclark/ultralogical

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6/v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable digest
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "${DIGEST}" ]; then
            echo "build-push-action did not emit digest" >&2
            exit 1
          fi
          IMAGE="ghcr.io/aleksclark/ultracore@${DIGEST}"
          echo "Immutable image: ${IMAGE}"
          mkdir -p dist
          cat > dist/images.lock.hcl <<EOF
          # Generated by release ${{ steps.version.outputs.version }} at ${{ github.sha }}
          locals {
            ultracore_image_repo   = "ghcr.io/aleksclark/ultracore"
            ultracore_image_tag    = "${{ steps.version.outputs.version }}"
            ultracore_image_digest = "${DIGEST}"
          }
          EOF
          printf '%s\n' "${IMAGE}" > dist/image-ref.txt
          printf '%s\n' "${DIGEST}" > dist/image-digest.txt

      - name: Create Git tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "tag ${VERSION} already exists" >&2
            exit 1
          fi
          git tag -a "${VERSION}" -m "ultracore ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2/v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ultracore ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/images.lock.hcl
            dist/image-ref.txt
            dist/image-digest.txt
          body: |
            ## Image
            - Repository: `ghcr.io/aleksclark/ultracore`
            - Tag: `${{ steps.version.outputs.version }}`
            - Digest: `${{ steps.build.outputs.digest }}`
            - Ref: `ghcr.io/aleksclark/ultracore@${{ steps.build.outputs.digest }}`

            Deploy with the digest form only. Do not treat `:latest` as authority.

  pin-jobspec:
    needs: release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Pin jobspec image to immutable digest
        env:
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re

          digest = os.environ["DIGEST"]
          version = os.environ["VERSION"]
          image = f"ghcr.io/aleksclark/ultracore@{digest}"
          job = pathlib.Path("deploy/nomad/ultracore.nomad.hcl")
          text = job.read_text()
          text2, n = re.subn(
              r'image\s*=\s*"ghcr\.io/aleksclark/ultracore[^"]*"',
              f'image      = "{image}"',
              text,
          )
          if n < 1:
              raise SystemExit(f"no image lines updated (n={n})")
          job.write_text(text2)
          lock = pathlib.Path("deploy/nomad/images.lock.hcl")
          lock.write_text(
              "# Immutable image authority for ultracore\n"
              f"# release {version} digest {digest}\n"
              "locals {\n"
              '  ultracore_image_repo   = "ghcr.io/aleksclark/ultracore"\n'
              f'  ultracore_image_tag    = "{version}"\n'
              f'  ultracore_image_digest = "{digest}"\n'
              "}\n"
          )
          print(f"pinned {n} image refs to {image}")
          PY

      - name: Open pin PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          set -euo pipefail
          BRANCH="release/pin-${VERSION}"
          if git diff --quiet; then
            echo "no pin diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add deploy/nomad/ultracore.nomad.hcl deploy/nomad/images.lock.hcl
          git commit -m "deploy: pin ultracore image to ${VERSION} digest"
          git push -u origin "${BRANCH}" --force-with-lease
          gh pr create \
            --title "deploy: pin ultracore ${VERSION} digest" \
            --body "Pins \`deploy/nomad/ultracore.nomad.hcl\` to immutable digest \`${DIGEST}\` from release ${VERSION}. Squash-merge after CI." \
            --base master \
            --head "${BRANCH}" || true
