version: "3"

tasks:
  default:
    deps: [build]

  build:
    desc: Build all Go packages
    cmds:
      - go build ./...

  generate:
    desc: Regenerate code from protos (Go + TS)
    cmds:
      - buf generate

  lint:
    desc: Lint Go and protos
    cmds:
      - buf lint
      - go vet ./...
      - golangci-lint run

  test:
    desc: Unit + store + queue + provider tests (real Postgres via testcontainers)
    cmds:
      # Excludes e2e/: the real-stack acceptance suite is task test:functional,
      # which additionally needs browser and Rust toolchains.
      - go test $(go list ./... | grep -v '/e2e$') -count=1 -timeout 30m

  test:functional:
    desc: Functional API suite (real stack, generated clients)
    cmds:
      - go test ./e2e/ -count=1 -timeout 40m

  cli:test:
    desc: Run the ultra CLI suite against the real stack
    cmds:
      - go test ./cmd/ultra/... -count=1 -timeout 20m

  test:all:
    desc: Everything
    cmds:
      - go test ./... -count=1 -timeout 45m

  verify:codegen:
    desc: Fail if generated code is out of sync with protos
    cmds:
      - bash scripts/verify-codegen.sh
      - python3 scripts/verify-codegen-rust.py
      # Generated TypeScript has to compile under the client's own resolution
      # settings, not merely exist. Skipped when deps are not installed so the
      # gate stays runnable without a node toolchain.
      - test -d clients/ts/node_modules && (cd clients/ts && npx tsc --noEmit) || echo "clients/ts deps not installed; run npm ci to include the TS typecheck"

  verify:codegen:mutation:
    desc: Prove the codegen drift gates fail on deliberate drift, then restore
    cmds:
      - bash scripts/mutate-codegen-gate.sh

  verify:coverage:
    desc: Validate the cross-client capability coverage matrix
    cmds:
      - python3 scripts/verify-coverage.py

  verify:coverage:mutation:
    desc: Prove coverage verification rejects false evidence claims
    cmds:
      - bash scripts/mutate-coverage-gate.sh

  verify:breaking:
    desc: Fail on breaking proto changes vs origin/main
    cmds:
      - buf breaking --against '.git#branch=origin/main,subdir=.'

  ts:install:
    desc: Install TS client deps
    dir: clients/ts
    cmds:
      - npm ci

  ts:check:
    desc: Typecheck the TS client
    dir: clients/ts
    cmds:
      - npx tsc --noEmit

  web:build:
    desc: Typecheck and build the React SPA
    dir: ui/web
    cmds:
      - npm run build

  web:test:
    desc: Run the Playwright golden suite (real backend via Go harness)
    cmds:
      - go test ./e2e/ -run TestA16 -v -timeout 20m

  desktop:test:
    desc: Run the GPUI desktop suites (real backend via Go harness)
    cmds:
      - go test ./e2e/ -run TestRustDesktop -v -timeout 30m

  dev:
    desc: Boot the full local stack in one command (Postgres, model, ultrad, worker, web)
    cmds:
      - bash scripts/dev-stack.sh

  dev:smoke:
    desc: Boot the stack, run the noninteractive smoke, and tear everything down
    cmds:
      - bash scripts/dev-stack.sh smoke
