version: "3"

tasks:
  default:
    deps: [build]

  build:
    desc: Build all Go packages
    cmds:
      - go build ./...

  generate:
    desc: Regenerate code from protos (Go + public TS + private admin TS)
    cmds:
      - bash scripts/generate.sh

  lint:
    desc: Lint Go and protos
    cmds:
      - buf lint
      - go vet ./...
      - |
        if ! golangci-lint version >/dev/null 2>&1; then
          echo "golangci-lint is not installed or has no selected version; CI runs it, so install it before relying on 'task lint'" >&2
          exit 1
        fi
      - golangci-lint run
      - bash scripts/check-extraction-fences.sh
      - bash scripts/check-admin-isolation.sh

  test:
    desc: Unit + store + queue + provider tests (real Postgres via testcontainers)
    cmds:
      - go test $(go list ./... | grep -v '/e2e$') -count=1 -timeout 30m

  test:functional:
    desc: Functional API suite (real stack, generated clients)
    cmds:
      - go test ./e2e/ -count=1 -timeout 40m

  cli:test:
    desc: Run the CLI suite against the real stack
    cmds:
      - go test ./cmd/core/... -count=1 -timeout 20m

  test:all:
    desc: Everything
    cmds:
      - go test ./... -count=1 -timeout 45m

  verify:codegen:
    desc: Fail if generated code is out of sync with protos
    cmds:
      - bash scripts/verify-codegen.sh
      - test -d clients/ts/node_modules && (cd clients/ts && npx tsc --noEmit) || echo "clients/ts deps not installed; run npm ci to include the TS typecheck"

  verify:codegen:mutation:
    desc: Prove the codegen drift gates fail on deliberate drift, then restore
    cmds:
      - bash scripts/mutate-codegen-gate.sh

  verify:coverage:
    desc: Validate the capability coverage matrix
    cmds:
      - python3 scripts/verify-coverage.py

  verify:coverage:mutation:
    desc: Prove coverage verification rejects false evidence claims
    cmds:
      - bash scripts/mutate-coverage-gate.sh

  verify:breaking:
    desc: Fail on breaking proto changes vs the frozen v1 image
    cmds:
      # Against the last committed tree on this branch (v1 freeze). After merge
      # to main, CI should switch against origin/main.
      - buf breaking --against '.git#branch=HEAD,subdir=.'

  ts:install:
    desc: Install TS client deps
    dir: clients/ts
    cmds:
      - npm ci

  ts:check:
    desc: Typecheck the TS client
    dir: clients/ts
    cmds:
      - npx tsc --noEmit

  sdk:test:
    desc: Go SDK + TS SDK smoke against the real stack
    cmds:
      - go test ./sdk/ ./e2e/ -run 'TestA45_|TestA46_|TestA48_|TestA01_TS' -count=1 -timeout 40m
      - |
        if [ -d clients/ts/node_modules ]; then
          echo "TS deps present (exercised via e2e TS tests)"
        else
          echo "clients/ts deps not installed; run task ts:install for full TS coverage"
        fi

  dev:
    desc: Boot the local stack (Postgres, model, API, worker)
    cmds:
      - bash scripts/dev-stack.sh

  dev:smoke:
    desc: Boot the stack, run the noninteractive smoke, and tear everything down
    cmds:
      - bash scripts/dev-stack.sh smoke

  admin:test:
    desc: Admin API functional + query conformance (real Postgres)
    cmds:
      - go test ./admin/... ./adminhttp/... ./postgres/ -run 'Admin|Query' -count=1 -timeout 30m
      - go test ./admin/ -count=1 -timeout 30m

  admin:e2e:
    desc: Boot Postgres+coreadmin (and cored), run Playwright admin API e2e
    cmds:
      - bash scripts/admin-e2e-stack.sh test

  admin:web:install:
    desc: Install admin-web npm deps
    dir: admin-web
    cmds:
      - npm install

  admin:web:build:
    desc: Typecheck and build the private admin SPA
    dir: admin-web
    cmds:
      - node scripts/check-import-gates.mjs
      - npm run build

  admin:web:gate:
    desc: Import isolation + direct list-RPC gates for admin-web
    dir: admin-web
    cmds:
      - node scripts/check-import-gates.mjs

  admin:web:test:
    desc: Boot real coreadmin+Postgres, serve SPA via Vite proxy, run Playwright golden paths
    cmds:
      - bash scripts/admin-e2e-stack.sh spa

  admin:security:test:
    desc: Admin ops security suite (roles, stale preview, reveal kill switch, audit)
    cmds:
      - go test ./admin/ -run 'E7_|AdminAuth|CoredHasNo|CoredPackage' -count=1 -timeout 30m
      - bash scripts/check-admin-isolation.sh

  # Additive Stacklane compose lifecycle. Does not replace `task dev` / scripts/dev-stack.sh
  # or legacy `docker compose up` (docker-compose.yml fixed host binds).
  dev:compose:check:
    desc: Fail-closed Stacklane/compose contract validation
    cmds:
      - bash scripts/compose-dev.sh check

  dev:compose:up:
    desc: Check, build, and start Stacklane compose stack; print endpoints
    cmds:
      - bash scripts/compose-dev.sh up

  dev:compose:status:
    desc: Compose ps + Stacklane/direct endpoint table
    cmds:
      - bash scripts/compose-dev.sh status

  dev:compose:endpoints:
    desc: Print Stacklane FQDNs and direct loopback port mappings
    cmds:
      - bash scripts/compose-dev.sh endpoints

  dev:compose:logs:
    desc: Follow Stacklane compose logs (Ctrl-C leaves stack up)
    cmds:
      - bash scripts/compose-dev.sh logs

  dev:compose:down:
    desc: Stop Stacklane compose stack (volumes preserved; never -v)
    cmds:
      - bash scripts/compose-dev.sh down

  dev:compose:destroy:
    desc: Destroy stack volumes (requires CONFIRM=ultracore-<instance>-destroy)
    cmds:
      - bash scripts/compose-dev.sh destroy

  dev:compose:test:
    desc: Lifecycle contract tests for the Stacklane compose wrapper
    cmds:
      - bash scripts/compose-dev_test.sh
