{
  "schema_version": 1,
  "project": "ultralogical",
  "owner": "aleks-clark",
  "repository": "https://github.com/aleksclark/ultralogical",
  "ref_policy": "signed-default-branch-commit",
  "namespace": "default",
  "datacenters": ["home"],
  "release_sets": [
    {
      "name": "ultracore",
      "jobs": [
        {
          "id": "ultracore",
          "spec": "jobs/ultracore.nomad.hcl"
        }
      ],
      "env": "env/home.nomadvars.hcl",
      "images": "images.lock.hcl",
      "variable_paths": [
        "nomad/jobs/ultracore"
      ],
      "rollout": "serial",
      "prune": "explicit-only"
    }
  ]
}
